<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洋流誌｜台北21地點</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#f7f7f7}header{padding:14px;background:white}h2{margin:0;font-size:22px}small{color:#666}#filters{display:flex;overflow:auto;gap:6px;padding:10px;background:white}button{white-space:nowrap;padding:9px;border:1px solid #ccc;border-radius:20px;background:white}button.on{background:#222;color:white}#map{height:55vh;min-height:330px}.list{padding:12px}.item{background:white;padding:12px;margin:8px 0;border-radius:12px}.item p{font-size:13px;color:#555}.pin{border:2px solid white;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:white;font-weight:bold;box-shadow:0 1px 5px #555}</style><header><h2>洋流誌｜台北21個地點</h2><small>①～⑥ 分類地圖・點選店家開啟 Google Maps</small></header><div id="filters"></div><div id="map"></div><div class="list"><div id="count"></div><div id="items"></div><small>地址依前次整理，尚未逐一核實。地圖定位需要網路，若未顯示圖釘請使用下方 Google Maps 連結。</small></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cats=[["①","市政治理與城市外交","#39884a"],["②","交通運輸","#3067a9"],["③","育兒","#e3a921"],["④","城市再造","#d32d32"],["⑤","勞動與經濟","#ad853f"],["⑥","白色特別版","#888"]];
const data=[[1,"唐山書店","大安區羅斯福路三段333巷9號 B1"],[1,"好土 home to","中山區中山北路二段72巷20號"],[1,"CUP 咖啡","松山區南京東路五段234號"],[1,"屯屯 Books & Booze","中山區長安東路一段39號"],[2,"陋巷咖啡廳","南港區忠孝東路七段487巷5號"],[2,"左轉有書","中正區鎮江街3-1號"],[2,"飛地 nowhere","萬華區中華路一段170-2號"],[2,"駱師傅法式冰淇淋之家","信義區永吉路30巷101弄10號"],[3,"Ice Gyaru 霜淇淋專門店","大安區和平東路一段10-1號"],[3,"現流冊店","大同區重慶北路二段70巷15號"],[3,"書房有光","大同區重慶北路三段25巷26號"],[3,"COFFEE FLAIR","中山區雙城街13巷11-1號"],[4,"The Birds Cafe 鳥咖啡","信義區信義路四段399號"],[4,"桃五咖啡","大安區瑞安街208巷56號"],[4,"禮洋 LEON FLORIST","大安區仁愛路三段24巷1-4號"],[4,"山峸二手書店 Ridgebooks","北投區中央南路一段102巷34號"],[5,"wen coffee 温咖啡","松山區民生東路三段113巷27號"],[5,"La Vie Friande 香・甜生活","大安區臥龍街267-7號"],[5,"boven 雜誌圖書館","大安區復興南路一段107巷5弄18號 B1"],[5,"自家屋珈琲焙煎所","內湖區內湖路一段437巷4弄2號"],[6,"沈伯洋競選總部","中正區北平東路30-1號"]].map((a,i)=>({id:i,cat:a[0],name:a[1],address:"台北市"+a[2]}));
const map=L.map("map").setView([25.045,121.53],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap",maxZoom:19}).addTo(map);const layer=L.layerGroup().addTo(map);let sel=0;
function link(d){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(d.name+" "+d.address)}
function draw(){document.getElementById("filters").innerHTML='<button data-i="0" class="'+(!sel?"on":"")+'">全部</button>'+cats.map((c,i)=>'<button data-i="'+(i+1)+'" class="'+(sel===i+1?"on":"")+'">'+c[0]+" "+c[1]+"</button>").join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;draw()});const arr=data.filter(d=>!sel||d.cat===sel);document.getElementById("count").textContent="顯示 "+arr.length+" 個地點";document.getElementById("items").innerHTML=arr.map(d=>'<div class="item"><b style="color:'+cats[d.cat-1][2]+'">'+cats[d.cat-1][0]+"</b> <b>"+d.name+"</b><p>"+d.address+'</p><a target="_blank" href="'+link(d)+'">Google Maps 搜尋／導航</a></div>').join("");layer.clearLayers();const markers=[];arr.forEach(d=>{if(!d.lat)return;const c=cats[d.cat-1];markers.push(L.marker([d.lat,d.lon],{icon:L.divIcon({className:"",html:'<div class="pin" style="background:'+c[2]+'">'+c[0]+"</div>",iconSize:[34,34]})}).bindPopup("<b>"+d.name+"</b><br>"+d.address+'<br><a target="_blank" href="'+link(d)+'">Google Maps 導航</a>').addTo(layer))});if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.15),{maxZoom:14})}
draw();(async()=>{for(const d of data){try{const cached=localStorage.getItem("yl_"+d.id);if(cached){[d.lat,d.lon]=JSON.parse(cached);draw();continue}const q=d.address.replace(" B1","")+", 台灣";const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&q="+encodeURIComponent(q));const a=await r.json();if(a.length){d.lat=+a[0].lat;d.lon=+a[0].lon;localStorage.setItem("yl_"+d.id,JSON.stringify([d.lat,d.lon]));draw()}await new Promise(r=>setTimeout(r,1200))}catch(e){console.warn(e)}}})();
</script></html>
